<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O.L.I.V.I.A. Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070b14;
      color: #e0f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    header {
      text-align: center;
      letter-spacing: 4px;
      font-size: 1.2rem;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
      margin-top: 10px;
    }

    /* Glowing AI Core Orb */
    .orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .orb {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 0%, #006064 60%, transparent 100%);
      box-shadow: 0 0 40px #00e5ff, inset 0 0 20px #ffffff;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: breathe 4s infinite ease-in-out;
    }

    .orb.listening {
      background: radial-gradient(circle, #ff4081 0%, #880e4f 60%, transparent 100%);
      box-shadow: 0 0 60px #ff4081, inset 0 0 25px #ffffff;
      animation: pulse 1s infinite ease-in-out;
    }

    .orb.speaking {
      box-shadow: 0 0 70px #00e5ff, 0 0 100px #00b8d4, inset 0 0 30px #ffffff;
      transform: scale(1.08);
    }

    .status-text {
      margin-top: 25px;
      font-size: 0.95rem;
      color: #80deea;
      letter-spacing: 1px;
    }

    /* Chat Output Box */
    .chat-box {
      width: 100%;
      max-width: 600px;
      height: 180px;
      background: rgba(13, 25, 43, 0.8);
      border: 1px solid #00838f;
      border-radius: 12px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-user {
      align-self: flex-end;
      background: #006064;
      padding: 8px 14px;
      border-radius: 12px 12px 0 12px;
      max-width: 80%;
      font-size: 0.95rem;
    }

    .msg-olivia {
      align-self: flex-start;
      background: #102a43;
      border-left: 3px solid #00e5ff;
      padding: 8px 14px;
      border-radius: 12px 12px 12px 0;
      max-width: 85%;
      font-size: 0.95rem;
    }

    /* Bottom Input Bar */
    .controls {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #00838f;
      background: #0d192b;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: #00e5ff;
      color: #070b14;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #84ffff;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
  </style>
</head>
<body>

  <header>O.L.I.V.I.A. // SYSTEM ONLINE</header>

  <div class="orb-container">
    <div class="orb" id="orb" title="Tap to Speak"></div>
    <div class="status-text" id="status">Tap the orb to speak, or type below</div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg-olivia">Systems initialized. Ready when you are, Olivia.</div>
  </div>

  <div class="controls">
    <input type="text" id="textInput" placeholder="Ask Olivia anything..." />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Connects your brain.js file -->
  <script src="brain.js"></script>

  <script>
    const orb = document.getElementById("orb");
    const statusText = document.getElementById("status");
    const chatBox = document.getElementById("chatBox");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");

    // 1. Setup Speech Recognition (Ears)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      recognition.onstart = () => {
        orb.classList.add("listening");
        statusText.textContent = "Listening...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleUserMessage(transcript);
      };

      recognition.onerror = (event) => {
        orb.classList.remove("listening");
        statusText.textContent = "Mic error (" + event.error + "). Try typing instead!";
      };

      recognition.onend = () => {
        orb.classList.remove("listening");
        if (statusText.textContent === "Listening...") {
          statusText.textContent = "Tap the orb to speak";
        }
      };
    } else {
      statusText.textContent = "Voice not supported in this browser—use the text box below.";
    }

    // Tap orb to start listening
    orb.addEventListener("click", () => {
      if (recognition) {
        window.speechSynthesis.cancel(); // Stop talking if interrupted
        recognition.start();
      }
    });

    // 2. Setup Speech Synthesis (Voice)
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      
      // Try to pick a natural female English voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => 
        v.lang.includes("en") && (v.name.includes("Female") || v.name.includes("Google UK English Female") || v.name.includes("Samantha") || v.name.includes("Zira"))
      );
      if (preferredVoice) utterance.voice = preferredVoice;

      utterance.rate = 1.05;
      utterance.pitch = 1.05;

      utterance.onstart = () => {
        orb.classList.add("speaking");
        statusText.textContent = "Olivia is speaking...";
      };

      utterance.onend = () => {
        orb.classList.remove("speaking");
        statusText.textContent = "Tap the orb to speak";
      };

      window.speechSynthesis.speak(utterance);
    }

    // Load voices properly in Chrome
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    // 3. Handle Messages & Connect to brain.js
    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = sender === "user" ? "msg-user" : "msg-olivia";
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleUserMessage(message) {
      if (!message.trim()) return;
      addMessage(message, "user");
      statusText.textContent = "Thinking...";

      // Send message to processCommand() inside brain.js
      const reply = await processCommand(message);
      addMessage(reply, "olivia");
      speak(reply);
    }

    // Text input button & Enter key support
    sendBtn.addEventListener("click", () => {
      handleUserMessage(textInput.value);
      textInput.value = "";
    });

    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        handleUserMessage(textInput.value);
        textInput.value = "";
      }
    });
  </script>
</body>
</html>
